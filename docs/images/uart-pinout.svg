<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="sans-serif" role="img" aria-label="Ecovacs deboot debug header UART pinout">
  <defs>
    <style>
      .bg{fill:#101418}
      .panel{fill:#2a2f35;stroke:#4a525b;stroke-width:2}
      .board{fill:#13472e;stroke:#0c2e1e;stroke-width:2}
      .pad{fill:#d9b36b;stroke:#8a6d33;stroke-width:1.5}
      .padC{fill:#c9ccd1;stroke:#7d828a;stroke-width:1.5}
      .usb{fill:#1b1f24;stroke:#8a9099;stroke-width:2}
      .lbl{fill:#e8eaed;font-size:16px;font-weight:700}
      .cyan{fill:#4fc3e8;font-size:18px;font-weight:700}
      .red{fill:#ff6b6b;font-size:14px;font-weight:700}
      .mut{fill:#aeb4bc;font-size:12px}
      .ttl{fill:#e8eaed;font-size:17px;font-weight:700}
      .ok{fill:#7ee081;font-size:13px;font-weight:600}
      .box{fill:none;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="400" rx="10"/>
  <text class="ttl" x="20" y="28">Ecovacs "deboot" (T8 AIVI / AI_px30) — debug header (2×4, 8-pin)</text>
  <text class="mut" x="20" y="47">Redrawn reference. 3.3 V TTL · 115200 8N1. Pad positions approximate — verify on your board &amp; DEF CON 32 slide 87.</text>

  <!-- service panel -->
  <rect class="panel" x="30" y="70" width="380" height="300" rx="10"/>

  <!-- debug PCB (landscape, 2 rows x 4 cols) -->
  <rect class="board" x="70" y="118" width="320" height="160" rx="6"/>

  <!-- 2 rows x 4 cols = 8 pins; cols x=140,200,260,320 ; rows y=155,205 -->
  <!-- top row -->
  <circle class="pad" cx="140" cy="155" r="14"/>
  <circle class="pad" cx="200" cy="155" r="14"/>
  <circle class="pad" cx="260" cy="155" r="14"/>  <!-- GND -->
  <circle class="pad" cx="320" cy="155" r="14"/>  <!-- 3.3V -->
  <!-- bottom row -->
  <circle class="padC" cx="140" cy="205" r="14"/>  <!-- RX -->
  <circle class="pad"  cx="200" cy="205" r="14"/>  <!-- TX -->
  <circle class="pad"  cx="260" cy="205" r="14"/>
  <circle class="pad"  cx="320" cy="205" r="14"/>

  <!-- highlight boxes -->
  <rect class="box" x="246" y="141" width="28" height="28" rx="4" stroke="#e8eaed"/>  <!-- GND -->
  <rect class="box" x="306" y="141" width="28" height="28" rx="4" stroke="#ff6b6b"/>  <!-- 3.3V -->
  <rect class="box" x="126" y="191" width="28" height="28" rx="4" stroke="#ffffff"/>  <!-- RX -->
  <rect class="box" x="186" y="191" width="28" height="28" rx="4" stroke="#7ee081"/>  <!-- TX -->

  <!-- MicroUSB centered below the header -->
  <rect class="usb" x="175" y="238" width="110" height="24" rx="5"/>
  <text class="red" x="182" y="279">MicroUSB</text>

  <text class="cyan" x="78" y="110">UART</text>

  <!-- leader labels -->
  <line x1="260" y1="141" x2="260" y2="104" stroke="#e8eaed" stroke-width="1.5"/>
  <text class="lbl" x="243" y="98">GND</text>
  <line x1="320" y1="141" x2="345" y2="106" stroke="#ff6b6b" stroke-width="1.5"/>
  <text class="red" x="330" y="100">3.3V</text>

  <line x1="140" y1="219" x2="140" y2="300" stroke="#ffffff" stroke-width="1.5"/>
  <text class="lbl" x="128" y="318">RX</text>
  <line x1="200" y1="219" x2="200" y2="300" stroke="#7ee081" stroke-width="1.5"/>
  <text class="lbl" x="188" y="318">TX</text>

  <!-- warning + arrow -->
  <line x1="390" y1="150" x2="450" y2="125" stroke="#4f91ff" stroke-width="3"/>
  <text class="red" x="450" y="100">Make sure the rotation /</text>
  <text class="red" x="450" y="118">alignment is correct —</text>
  <text class="red" x="450" y="136">some units are 180° rotated!</text>

  <!-- wiring legend -->
  <text class="ttl" x="450" y="182">Wiring</text>
  <text class="ok"  x="450" y="208">✓ adapter GND → board GND</text>
  <text class="ok"  x="450" y="231">✓ adapter TX  → board RX</text>
  <text class="ok"  x="450" y="254">✓ adapter RX  → board TX</text>
  <text class="red" x="450" y="279">✗ leave 3.3V / VCC off</text>
  <text class="mut" x="450" y="302">(power from the robot's own battery,</text>
  <text class="mut" x="450" y="319"> share ground only; adapter at 3.3 V)</text>
  <text class="mut" x="450" y="346">No output? swap TX/RX, check GND,</text>
  <text class="mut" x="450" y="363"> or try the 180°-rotated orientation.</text>

  <text class="mut" x="20" y="392">Original annotated photo: DEF CON 32, Giese &amp; braelynn — see docs/references.md.</text>
</svg>
