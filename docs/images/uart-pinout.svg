<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" font-family="sans-serif" role="img" aria-label="Ecovacs deboot debug header UART pinout">
  <defs>
    <style>
      .bg{fill:#101418}
      .panel{fill:#2a2f35;stroke:#4a525b;stroke-width:2}
      .board{fill:#13472e;stroke:#0c2e1e;stroke-width:2}
      .pad{fill:#d9b36b;stroke:#8a6d33;stroke-width:1.5}
      .padC{fill:#c9ccd1;stroke:#7d828a;stroke-width:1.5}
      .usb{fill:#1b1f24;stroke:#8a9099;stroke-width:2}
      .lbl{fill:#e8eaed;font-size:16px;font-weight:700}
      .cyan{fill:#4fc3e8;font-size:18px;font-weight:700}
      .red{fill:#ff6b6b;font-size:14px;font-weight:700}
      .mut{fill:#aeb4bc;font-size:12px}
      .ttl{fill:#e8eaed;font-size:17px;font-weight:700}
      .ok{fill:#7ee081;font-size:13px;font-weight:600}
      .box{fill:none;stroke-width:2}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="820" height="400" rx="10"/>
  <text class="ttl" x="20" y="28">Ecovacs "deboot" (T8 AIVI / AI_px30) — debug header (2×6)</text>
  <text class="mut" x="20" y="47">Redrawn reference. 3.3 V TTL · 115200 8N1. Pad positions approximate — verify on your board &amp; DEF CON 32 slide 87.</text>

  <!-- service panel -->
  <rect class="panel" x="30" y="70" width="450" height="300" rx="10"/>

  <!-- debug PCB (landscape, 2 rows x 6 cols) -->
  <rect class="board" x="70" y="118" width="400" height="160" rx="6"/>

  <!-- 2 rows x 6 cols; cols x=115,170,225,280,335,390 ; rows y=155,205 -->
  <!-- top row -->
  <circle class="pad" cx="115" cy="155" r="13"/>
  <circle class="pad" cx="170" cy="155" r="13"/>
  <circle class="pad" cx="225" cy="155" r="13"/>
  <circle class="pad" cx="280" cy="155" r="13"/>  <!-- GND -->
  <circle class="pad" cx="335" cy="155" r="13"/>  <!-- 3.3V -->
  <circle class="pad" cx="390" cy="155" r="13"/>
  <!-- bottom row -->
  <circle class="padC" cx="115" cy="205" r="13"/>  <!-- RX -->
  <circle class="pad"  cx="170" cy="205" r="13"/>  <!-- TX -->
  <circle class="pad"  cx="225" cy="205" r="13"/>
  <circle class="pad"  cx="280" cy="205" r="13"/>
  <circle class="pad"  cx="335" cy="205" r="13"/>
  <circle class="pad"  cx="390" cy="205" r="13"/>

  <!-- highlight boxes -->
  <rect class="box" x="266" y="141" width="28" height="28" rx="4" stroke="#e8eaed"/>  <!-- GND -->
  <rect class="box" x="321" y="141" width="28" height="28" rx="4" stroke="#ff6b6b"/>  <!-- 3.3V -->
  <rect class="box" x="101" y="191" width="28" height="28" rx="4" stroke="#ffffff"/>  <!-- RX -->
  <rect class="box" x="156" y="191" width="28" height="28" rx="4" stroke="#7ee081"/>  <!-- TX -->

  <!-- MicroUSB centered below the header -->
  <rect class="usb" x="225" y="238" width="110" height="24" rx="5"/>
  <text class="red" x="232" y="279">MicroUSB</text>

  <text class="cyan" x="78" y="110">UART</text>

  <!-- leader labels -->
  <line x1="280" y1="141" x2="280" y2="104" stroke="#e8eaed" stroke-width="1.5"/>
  <text class="lbl" x="263" y="98">GND</text>
  <line x1="335" y1="141" x2="372" y2="104" stroke="#ff6b6b" stroke-width="1.5"/>
  <text class="red" x="312" y="96">3.3V — do NOT connect</text>

  <line x1="115" y1="219" x2="115" y2="300" stroke="#ffffff" stroke-width="1.5"/>
  <text class="lbl" x="103" y="318">RX</text>
  <line x1="170" y1="219" x2="170" y2="300" stroke="#7ee081" stroke-width="1.5"/>
  <text class="lbl" x="158" y="318">TX</text>

  <!-- warning + arrow -->
  <line x1="470" y1="150" x2="530" y2="125" stroke="#4f91ff" stroke-width="3"/>
  <text class="red" x="530" y="100">Make sure the rotation /</text>
  <text class="red" x="530" y="118">alignment is correct —</text>
  <text class="red" x="530" y="136">some units are 180° rotated!</text>

  <!-- wiring legend -->
  <text class="ttl" x="530" y="182">Wiring</text>
  <text class="ok"  x="530" y="208">✓ adapter GND → board GND</text>
  <text class="ok"  x="530" y="231">✓ adapter TX  → board RX</text>
  <text class="ok"  x="530" y="254">✓ adapter RX  → board TX</text>
  <text class="red" x="530" y="279">✗ leave 3.3V / VCC off</text>
  <text class="mut" x="530" y="302">(power from the robot's own battery,</text>
  <text class="mut" x="530" y="319"> share ground only; adapter at 3.3 V)</text>
  <text class="mut" x="530" y="346">No output? swap TX/RX, check GND,</text>
  <text class="mut" x="530" y="363"> or try the 180°-rotated orientation.</text>

  <text class="mut" x="20" y="392">Original annotated photo: DEF CON 32, Giese &amp; braelynn — see docs/references.md.</text>
</svg>
